[project]
name = "orchid-iot-platform"
version = "0.4.0"
description = "Secure Orchid IoT Control Platform - Assignment #4 MQTT lab (Architecture V2.2)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["services", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "stack: requires the running docker compose lab (python scripts/verify_all.py starts it)",
    "slow: long-running failure/fault-injection scenario",
]
