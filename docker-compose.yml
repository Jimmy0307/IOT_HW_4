    read_only: true
    tmpfs:
    - /tmp:size=16m
    environment:
      ORCHID_CONFIG: /app/config/platform.yaml
      ORCHID_SITE_ID: site06
    volumes:
    - ./config:/app/config:ro
    - ./secrets/pki/ca.crt:/run/orchid-secrets/ca.crt:ro
    - ./secrets/mqtt/site06-temp01.pw:/run/orchid-secrets/temp01.pw:ro
    - ./secrets/mqtt/site06-humidity01.pw:/run/orchid-secrets/humidity01.pw:ro
    networks:
    - site06_net
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 128m
    pids_limit: 128
    logging: *id002
    depends_on:
      site06-broker: *id001
  lab-probe:
    image: orchid-python:local
    container_name: orchid-lab-probe
    hostname: lab-probe
    command:
    - sleep
    - infinity
    read_only: true
    tmpfs:
    - /tmp:size=16m
    environment:
      ORCHID_CONFIG: /app/config/platform.yaml
    volumes:
    - ./config:/app/config:ro
    - ./secrets/pki/ca.crt:/run/orchid-secrets/ca.crt:ro
    - ./secrets/mqtt:/run/orchid-secrets/mqtt:ro
    networks:
    - central_ot_net
    - site01_net
    - site02_net
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 128m
    pids_limit: 128
    logging: *id002
    profiles:
    - test
    healthcheck:
