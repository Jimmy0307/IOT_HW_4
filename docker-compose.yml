# =====================================================================
# GENERATED by scripts/render_compose.py from config/platform.yaml.
# Do not edit by hand: edit the generator and re-run it.
# Secrets are bind-mounted read-only from ./secrets (gitignored).
# Only reverse-proxy publishes a host port (127.0.0.1:8443). No MQTT port
# (1883/8883) is published to the host.
# =====================================================================
name: orchid
services:
  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: orchid-reverse-proxy
    hostname: reverse-proxy
    ports:
    - ${ORCHID_HTTPS_BIND:-127.0.0.1}:${ORCHID_HTTPS_PORT:-8443}:8443
    volumes:
    - ./services/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./services/reverse-proxy/orchid_proxy_headers.conf:/etc/nginx/orchid_proxy_headers.conf:ro
    - ./secrets/pki/reverse-proxy-fullchain.crt:/run/orchid-secrets/tls.crt:ro
    - ./secrets/pki/reverse-proxy.key:/run/orchid-secrets/tls.key:ro
    - ./secrets/pki/ca.crt:/run/orchid-secrets/ca.crt:ro
    networks:
    - wan_net
    - dmz_net
    read_only: true
    tmpfs:
    - /tmp:size=16m
    depends_on:
      frontend: &id001
        condition: service_healthy
      central-api: *id001
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - --cacert
      - /run/orchid-secrets/ca.crt
      - https://localhost:8443/api/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 64m
    pids_limit: 128
    logging: &id002
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
  frontend:
    build:
      context: ./services/frontend
    image: orchid-frontend:local
    container_name: orchid-frontend
    hostname: frontend
    networks:
    - dmz_net
    read_only: true
    tmpfs:
    - /tmp:size=16m
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 64m
    pids_limit: 128
    logging: *id002
  central-api:
    image: orchid-python:local
    container_name: orchid-central-api
    hostname: central-api
    command:
    - uvicorn
    - --factory
    - orchid.central_api.app:build_production_app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-server-header
    - --no-access-log
    read_only: true
    tmpfs:
    - /tmp:size=16m
    environment:
      ORCHID_CONFIG: /app/config/platform.yaml
    volumes:
    - ./config:/app/config:ro
    - historian_data:/data
    - ./secrets/pki/ca.crt:/run/orchid-secrets/ca.crt:ro
    - ./secrets/mqtt/central-api.pw:/run/orchid-secrets/mqtt.pw:ro
    - ./secrets/app/jwt_secret:/run/orchid-secrets/jwt_secret:ro
    - ./secrets/app/web_users.json:/run/orchid-secrets/web_users.json:ro
    networks:
    - dmz_net
    - central_ot_net
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 192m
    pids_limit: 128
    logging: *id002
    depends_on:
      central-broker: *id001
    build:
      context: ./services
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  historian:
    image: orchid-python:local
    container_name: orchid-historian
    hostname: historian
    command:
    - python
    - -m
    - orchid.historian.main
    read_only: true
    tmpfs:
    - /tmp:size=16m
    environment:
      ORCHID_CONFIG: /app/config/platform.yaml
    volumes:
    - ./config:/app/config:ro
    - historian_data:/data
    - ./secrets/pki/ca.crt:/run/orchid-secrets/ca.crt:ro
    - ./secrets/mqtt/historian.pw:/run/orchid-secrets/mqtt.pw:ro
    - ./secrets/app/audit_hmac_key:/run/orchid-secrets/audit_hmac_key:ro
    networks:
    - central_ot_net
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 256m
    pids_limit: 128
    logging: *id002
    depends_on:
