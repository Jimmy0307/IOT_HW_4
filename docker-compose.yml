    read_only: true
    tmpfs:
    - /tmp:size=16m
    environment:
      ORCHID_CONFIG: /app/config/platform.yaml
      ORCHID_SITE_ID: site06
    volumes:
    - ./config:/app/config:ro
    - site06_controller_data:/data
    - ./secrets/pki/ca.crt:/run/orchid-secrets/ca.crt:ro
    - ./secrets/mqtt/site06-controller.pw:/run/orchid-secrets/mqtt.pw:ro
    networks:
    - site06_net
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    mem_limit: 192m
    pids_limit: 128
    logging: *id002
    depends_on:
      site06-broker: *id001
  site06-sim:
    image: orchid-python:local
    container_name: orchid-site06-sim
    hostname: site06-sim
    command:
