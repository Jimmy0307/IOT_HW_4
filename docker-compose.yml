    - ./secrets/mqtt/bridge-site06.pw:/run/orchid-secrets/bridge.pw:ro
    - site06_broker_data:/mosquitto/data
    networks:
    - bridge06_net
    - site06_net
    tmpfs:
    - /mosquitto/runtime:size=4m,uid=1883,gid=1883,mode=0700
    restart: unless-stopped
