# Reverse proxy (DMZ edge). The ONLY container with a host-published port.
# TLS terminates here with a lab-CA certificate (SAN: localhost, 127.0.0.1, reverse-proxy).

limit_req_zone $binary_remote_addr zone=orchid_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=orchid_login:10m rate=10r/m;

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /run/orchid-secrets/tls.crt;
    ssl_certificate_key /run/orchid-secrets/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:orchid_tls:1m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/auth/login {
        limit_req zone=orchid_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://central-api:8000;
        include /etc/nginx/orchid_proxy_headers.conf;
    }

    location /api/ {
        limit_req zone=orchid_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://central-api:8000;
        include /etc/nginx/orchid_proxy_headers.conf;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        # The edge is the single authority for security headers.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
    }
}
