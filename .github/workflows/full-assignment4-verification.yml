name: Full Assignment4 Verification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/assignment4-orchid-mqtt
    paths:
      - .github/workflows/full-assignment4-verification.yml

permissions:
  contents: read

concurrency:
  group: assignment4-full-verification-fixed
  cancel-in-progress: false

jobs:
  verify:
    name: 34-gate full fresh verification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUTF8: "1"
      CI: "true"
      ORCHID_EPHEMERAL_BIND_SECRET_MODE: "1"

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment preflight
        run: |
          echo "SHA=$GITHUB_SHA"
          uname -a
          free -h
          df -h
          docker version
          docker compose version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/frontend/package-lock.json
            tests/ui/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install browser QA dependencies
        working-directory: tests/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Resource check before full run
        run: |
          free -h
          df -h
          docker system df

      - name: Run canonical fresh verification
        id: verify
        run: python scripts/verify_all.py --fresh

      - name: Print final gate summary
        if: always()
        run: |
          echo "=== resources ==="
          free -h || true
          df -h || true
          docker system df || true
          echo "=== compose status ==="
          docker compose ps -a || true
          echo "=== gate summary ==="
          if [ -f evidence/generated/gate_summary.json ]; then
            cat evidence/generated/gate_summary.json
          else
            echo "gate_summary.json not produced"
          fi
          echo "=== verify steps ==="
          if [ -f evidence/generated/verify_all/steps.json ]; then
            cat evidence/generated/verify_all/steps.json
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment4-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            evidence/generated/
            docs/TEST_MATRIX.md
            docs/FINAL_ACCEPTANCE_REPORT.md
            docs/ASSIGNMENT4_REPORT.md
            ARCHITECTURE.md
            README.md